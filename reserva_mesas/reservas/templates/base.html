<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <!-- El logo ahora lleva al Home público -->
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                <i class="bi bi-layout-text-window-reverse"></i> Sistema de Reservas
            </a>
            
            <!-- Botón hamburguesa para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Enlaces dinámicos -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Enlace público (siempre visible) -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-house-door"></i> Inicio</a>
                    </li>

                    <!-- Mostrar solo si el usuario está logueado -->
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'mesa_list' %}"><i class="bi bi-grid-3x3-gap"></i> Admin Mesas</a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link text-danger" href="/admin/logout/"><i class="bi bi-box-arrow-right"></i> Salir</a>
                        </li>
                    {% else %}
                        <!-- Si no está logueado, mostramos un botón para entrar al admin -->
                        <li class="nav-item">
                            <a class="nav-link text-warning fw-bold" href="/admin/login/?next=/mesas/">
                                <i class="bi bi-shield-lock"></i> Acceso Administrador
                            </a>
                        </li>
                    {% endif %}
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mesa_list' %}"><i class="bi bi-grid-3x3-gap"></i> Mesas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cliente_list' %}"><i class="bi bi-people"></i> Clientes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL: Aquí se inyecta el contenido de las otras páginas -->
    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS (necesario para el menú hamburguesa en móviles) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
