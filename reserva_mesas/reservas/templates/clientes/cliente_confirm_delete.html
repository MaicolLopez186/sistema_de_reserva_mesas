{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmar Eliminación</h4>
            </div>
            <div class="card-body text-center py-4">
                <p class="fs-5">¿Estás seguro de que deseas eliminar al cliente <strong>{{ object.nombre }} {{ object.apellido }}</strong>?</p>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash"></i> Sí, eliminar
                    </button>
                    <a href="{% url 'cliente_list' %}" class="btn btn-secondary px-4">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
