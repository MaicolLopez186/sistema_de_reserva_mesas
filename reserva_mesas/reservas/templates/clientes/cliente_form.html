{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">
                    {% if object %}<i class="bi bi-pencil-square"></i> Editar Cliente{% else %}<i class="bi bi-person-plus"></i> Crear Nuevo Cliente{% endif %}
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'cliente_list' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    p label { font-weight: 600; margin-bottom: 5px; display: block; }
    p input[type="text"], p input[type="number"], p input[type="email"] { 
        width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 5px; 
    }
    p input[type="checkbox"] { margin-right: 5px; }
</style>
{% endblock %}
