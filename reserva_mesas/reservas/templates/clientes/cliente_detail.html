{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-person-vcard"></i> Ficha del Cliente</h4>
                {% if cliente.vip %}
                    <span class="badge bg-warning text-dark fs-6"><i class="bi bi-star-fill"></i> VIP</span>
                {% endif %}
            </div>
            <div class="card-body">
                <h3 class="text-center mb-4">{{ cliente.nombre }} {{ cliente.apellido }}</h3>
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong><i class="bi bi-calendar-event text-muted"></i> Edad:</strong> 
                        <span>{{ cliente.edad }} años</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong><i class="bi bi-telephone-fill text-muted"></i> Teléfono:</strong> 
                        <span>{{ cliente.telefono }}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <strong><i class="bi bi-envelope-fill text-muted"></i> Correo:</strong> 
                        <span>{{ cliente.correo }}</span>
                    </li>
                </ul>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'cliente_list' %}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                    <div>
                        <a href="{% url 'cliente_update' cliente.pk %}" class="btn btn-warning">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a href="{% url 'cliente_delete' cliente.pk %}" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
